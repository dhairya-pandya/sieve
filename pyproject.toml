[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redswarm"
version = "0.1.0"
description = "Red-team bounty arena for AI agents that hold money, on NEAR"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "httpx",
  "pydantic",
  "py-near",
  "pynacl",
  "base58",
  "openai",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["redswarm*"]

[tool.setuptools.package-data]
redswarm = ["arena/static/*.html", "demo/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = ["tests"]
markers = ["slow: needs the local NEAR sandbox (about 4 minutes)"]
